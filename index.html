<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asset Vault · Studio Hub</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0c0f15;color:#eff2f2;font-family:system-ui,sans-serif}.shell{height:100%;display:flex;flex-direction:column}.bar{height:57px;background:#10141b;border-bottom:1px solid #2c313a;display:flex;align-items:center;gap:18px;padding:0 20px;flex-shrink:0}.brand{font-weight:800;letter-spacing:.04em;font-size:13px;white-space:nowrap}.brand span{background:#c7f36b;color:#111;padding:6px 9px;border-radius:7px;margin-right:8px}.tabs{display:flex;gap:5px;height:100%;align-items:center}.tabs button{background:transparent;border:0;border-radius:7px;padding:9px 13px;color:#9ca6b3;font-weight:600;cursor:pointer}.tabs button.active{color:#d6f5a5;background:#293326}.hint{margin-left:auto;font-size:11px;color:#8c95a0}iframe{width:100%;flex:1;border:0;background:#0c0e13;min-height:0}@media(max-width:580px){.bar{padding:0 8px;gap:8px}.brand{font-size:0}.brand span{font-size:14px}.tabs button{padding:8px;font-size:12px}.hint{display:none}}
</style></head><body><div class="shell"><header class="bar"><div class="brand"><span>◇</span> WORKSPACE</div><nav class="tabs"><button data-page="studio-hub" class="active">Studio Hub</button><button data-page="asset-vault">Asset Vault 🔒</button></nav><div class="hint">Panel zespołu i kartoteka w jednym miejscu</div></header><iframe id="app" title="Studio Hub" src="studio-hub/"></iframe></div><script>document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x===b));let a=document.querySelector('#app');a.src=b.dataset.page+'/';a.title=b.dataset.page==='studio-hub'?'Studio Hub':'Asset Vault'});</script></body></html>
