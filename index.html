padding:14px 19px;border-top:1px solid #292d36;color:#b9bfca}tbody tr{cursor:pointer}tbody tr:hover{background:#1c2028}.asset{display:flex;gap:12px;align-items:center}.thumb{width:43px;height:43px;border-radius:7px;background:#292e31;display:grid;place-items:center;color:#b7cd9f;overflow:hidden;font-size:20px;flex-shrink:0}.thumb img{width:100%;height:100%;object-fit:cover}.asset strong{display:block;color:#ecedf0;font-size:13px}.asset small{color:#737b89;font-size:11px;display:block;margin-top:5px}.badge{display:inline-flex;align-items:center;gap:6px;border-radius:5px;padding:6px 8px;font-size:11px;font-weight:600;background:#343325;color:#e9ce7b}.badge:before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}.badge.ok{background:#24372c;color:#98dba6}.badge.risk{background:#3b292b;color:#ed9999}.badge.neutral{background:#2a2d36;color:#acb3c1}.empty{text-align:center;padding:48px 20px;color:#858d9b}.empty .empty-icon{font-size:26px;color:#9bb17d}.empty strong{display:block;color:#e3e6e9;margin:12px 0 6px}.empty p{margin:0 auto;max-width:360px;line-height:1.6}.lower{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}.info{border:1px solid #292d36;background:#14171e;border-radius:10px;padding:20px}.info h3{margin:0 0 8px;font:600 15px 'Space Grotesk'}.info p{color:#8e95a2;font-size:12px;line-height:1.6;margin:0}.info .link{margin-top:15px;display:inline-block}.modal-bg{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:4}.modal-bg.open{display:flex}.modal{width:min(680px,100%);max-height:90vh;overflow:auto;background:#191c24;border:1px solid #363b46;border-radius:14px;padding:25px;box-shadow:0 20px 80px #0009}.modal h2{font:600 22px 'Space Grotesk';margin:0}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.close{border:0;background:none;color:#9ca3af;font-size:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15 </style></head><body><aside><div class="brand"><div class="logo">◇</div><div>ASSET VAULT<small>ROBLOX WORKSPACE</small></div></div><div class="nav-label">PRZESTRZEŃ ROBOCZA</div><nav class="nav"><button data-view="dashboard" class="active"><span>▦</span><em>Przegląd</em></button><button data-view="models"><span>◇</span><em>Modele</em></button><button data-view="developers"><span>♙</span><em>Developerzy</em></button><button data-view="backup"><span>▤</span><em>Kopia danych</em></button></nav><div class="sidebottom"><strong><span class="dot"></span>Twoja kartoteka</strong><br>Wspólna baza danych<br>Wersja online</div></aside><main><header class="topbar"><div>PRZESTRZEŃ ROBOCZA <span style="padding:0 10px;color:#4e5562">/</span> <b id="crumb">Przegląd</b></div><div class="topright"><span>Prywatna kartoteka</span><button class="textbtn" onclick="logout()">Wyloguj</button><div class="avatar">AV</div></div></header><div class="content" id="content"></div></main><div class="modal-bg" id="modal"><div class="modal" id="modalBody"></div></div><input type="file" id="importFile" accept="application/json" hidden><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
let db={models:[],developers:[]}; let view='dashboard',query='',filter='all'; let client, revision=0;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function save(){let {data,error}=await client.from('vault').update({data:db,revision:revision+1}).eq('id',1).eq('revision',revision).select('revision');if(error){alert('Nie udało się zapisać danych: '+error.message+'\nSprawdź połączenie i uprawnienia.');return false}if(!data||!data.length){alert('Kartoteka została zmieniona przez inną osobę. Twój zapis nie został wykonany. Skopiuj swoje zmiany i odśwież stronę przed ponowną edycją.');return false}revision=data[0].revision;return true}
function switchView(v){view=v;query='';filter='all';render()};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>switchView(b.dataset.view));
function status(s){let cl=s==='Zweryfikowany'?'ok':s==='Podejrzany'?'risk':s==='Odrzucony'?'neutral':'';return `<span class="badge ${cl}">${esc(s||'Do weryfikacji')}</span>`}function devName(id){return db.developers.find(d=>d.id===id)?.name||'Nie przypisano'}function date(d){return d?new Date(d).toLocaleDateString('pl-PL'):'—'}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('#crumb').textContent=({dashboard:'Przegląd',models:'Modele',developers:'Developerzy',backup:'Kopia danych'})[view];let c=$('#content');if(view==='backup'){c.innerHTML=`<div class="heading"><div><div class="eyebrow">BEZPIECZEŃSTWO DANYCH</div><h1>Kopia danych</h1><p>Przenieś swoją kartotekę lub zachowaj ją na później.</p></div></div><div class="notice">Dane i załączniki są przechowywane we wspólnej bazie Supabase. Regularnie eksportuj kopię. Przy jednoczesnej edycji konflikt zostanie zgłoszony — odśwież stronę przed ponowną próbą zapisu.</div><div class="lower"><div class="info"><h3>Eksportuj kartotekę</h3><p>Pobierz modele, developerów i załączniki jako plik JSON. Przechowuj go w bezpiecznym miejscu.</p><button class="btn primary link" onclick="exportData()">↓ &nbsp; Eksportuj dane</button></div><div class="info"><h3>Importuj kartotekę</h3><p>Przywróć wcześniej wyeksportowaną kopię. Import zastąpi obecną kartotekę.</p><button class="btn link" onclick="document.querySelector('#importFile').click()">↑ &nbsp; Importuj dane</button></div></div>`;return}if(view==='developers'){renderDevelopers();return}let count=db.models.length, verified=db.models.filter(m=>m.status==='Zweryfikowany').length, pending=db.models.filter(m=>m.status==='Do weryfikacji').length, risk=db.models.filter(m=>m.status==='Podejrzany').length;c.innerHTML=`<div class="heading"><div><div class="eyebrow">${view==='dashboard'?'TWOJA PRZESTRZEŃ ROBOCZA':'BAZA ZASOBÓW'}</div><h1>${view==='dashboard'?'Wszystko pod kontrolą.':'Kartoteka modeli'}</h1><p>${view==='dashboard'?'Twoje modele, developerzy i weryfikacje w jednym miejscu.':'Przeglądaj i zarządzaj modelami dodanymi do kartoteki.'}</p></div><button class="btn primary" onclick="modelForm()">＋ &nbsp; Dodaj model</button></div>${view==='dashboard'?`<div class="stats"><div class="stat"><div class="stat-top">Wszystkie modele <span class="stat-icon">◇</span></div><strong>${count}</strong><small>W twojej kartotece</small></div><div class="stat"><div class="stat-top">Do weryfikacji <span class="stat-icon">◷</span></div><strong>${pending}</strong><small>Wymagają sprawdzenia</small></div><div class="stat"><div class="stat-top">Zweryfikowane <span class="stat-icon">✓</span></div><strong>${verified}</strong><small>Oznaczone jako sprawdzone</small></div><div class="stat"><div class="stat-top">Podejrzane <span class="stat-icon">⚑</span></div><strong>${risk}</strong><small>Warto przyjrzeć się bliżej</small></div></div>`:''}<div class="section-head"><div><h2>${view==='dashboard'?'Ostatnio dodane':'Wszystkie modele'}</h2><p>Dokumentuj pochodzenie i śledź status swoich zasobów.</p></div>${view==='dashboard'?'<button class="textbtn" onclick="switchView(\'models\')">Zobacz wszystkie →</button>':''}</div><div class="toolbar"><div class="search"><input id="search" placeholder="Szukaj modelu lub developera..." value="${esc(query)}"></div><select id="filter"><option value="all">Wszystkie statusy</option>${['Do weryfikacji','Zweryfikowany','Podejrzany','Odrzucony'].map(s=>`<option ${filter===s?'selected':''}>${s}</option>`).join('')}</select></div><div id="modelTable"></div>${view==='dashboard'?`<div class="lower"><div class="info"><h3>♙ &nbsp; Znasz swoich developerów?</h3><p>Stwórz osobną kartę dla każdego developera i przypisuj do niej dostarczone modele.</p><button class="textbtn link" onclick="switchView('developers')">Przejdź do developerów →</button></div><div class="info"><h3>⌁ &nbsp; Weryfikacja zaczyna się od źródła</h3><p>Zapisuj linki, dowody autorstwa i notatki. Status ustawiasz samodzielnie — aplikacja nie wykrywa automatycznie wycieków.</p></div></div>`:''}`;$('#search').oninput=e=>{query=e.target.value;modelsTable()};$('#filter').onchange=e=>{filter=e.target.value;modelsTable()};modelsTable()}
function modelsTable(){let q=query.toLowerCase(), list=[...db.models].reverse().filter(m=>(m.name+' '+devName(m.developer)+' '+(m.category||'')).toLowerCase().includes(q)&&(filter==='all'||m.status===filter));if(view==='dashboard')list=list.slice(0,5);$('#modelTable').innerHTML=`<div class="tablewrap"><table><thead><tr><th>Model</th><th>Developer</th><th>Status</th><th>Data dodania</th><th></th></tr></thead><tbody>${list.map(m=>`<tr onclick="modelDetail('${m.id}')"><td><div class="asset"><div class="thumb">${m.image?`<img src="${esc(m.image.data)}">`:'◇'}</div><div><strong>${esc(m.name)}</strong><small>${esc(m.category||'Bez kategorii')}</small></div></div></td><td>${esc(devName(m.developer))}</td><td>${status(m.status)}</td><td>${date(m.created)}</td><td>→</td></tr>`).join('')}</tbody></table>${!list.length?`<div class="empty"><div class="empty-icon">◇</div><strong>${db.models.length?'Nie znaleziono modeli':'Tu pojawią się twoje modele'}</strong><p>${db.models.length?'Spróbuj zmienić wyszukiwanie lub filtr.':'Dodaj pierwszy model, aby zacząć budować swoją kartotekę.'}</p></div>`:''}</div>`}
function renderDevelopers(){let q=query.toLowerCase(),ds=db.developers.filter(d=>(d.name+' '+(d.roblox||'')).toLowerCase().includes(q));$('#content').innerHTML=`<div class="heading"><div><div class="eyebrow">TWÓJ ZESPÓŁ</div><h1>Developerzy</h1><p>Osobne akta osób, które tworzą zasoby do twojej gry.</p></div><button class="btn primary" onclick="developerForm()">＋ &nbsp; Dodaj developera</button></div><div class="section-head"><div><h2>Wszyscy developerzy <span style="color:#818997">${db.developers.length}</span></h2><p>Kliknij w osobę, aby zobaczyć jej akta i modele.</p></div></div><div class="toolbar"><div class="search"><input id="devsearch" placeholder="Szukaj developera..." value="${esc(query)}"></div></div><div class="tablewrap"><table><thead><tr><th>Developer</th><th>Roblox</th><th>Modele</th><th>Dodano</th><th></th></tr></thead><tbody>${ds.map(d=>`<tr onclick="developerDetail('${d.id}')"><td><div class="asset"><div class="thumb">♙</div><div><strong>${esc(d.name)}</strong><small>${esc(d.role||'Developer')}</small></div></div></td><td>${esc(d.roblox||'—')}</td><td>${db.models.filter(m=>m.developer===d.id).length}</td><td>${date(d.created)}</td><td>→</td></tr>`).join('')}</tbody></table>${!ds.length?'<div class="empty"><div class="empty-icon">♙</div><strong>Brak developerów</strong><p>Dodaj developera lub zmień wyszukiwanie.</p></div>':''}</div>`;let el=$('#devsearch');el.oninput=e=>{query=e.target.value;let pos=e.target.selectionStart;renderDevelopers();$('#devsearch').focus();$('#devsearch').setSelectionRange(pos,pos)}}
function openModal(html){$('#modalBody').innerHTML=html;$('#modal').classList.add('open')}function closeModal(){$('#modal').classList.remove('open')}$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function modelForm(id){let m=db.models.find(x=>x.id===id)||{};openModal(`<div class="modal-head"><h2>${id?'Edytuj model':'Dodaj model'}</h2><button class="close" onclick="closeModal()">×</button></div><form id="modelForm"><div class="grid"><label class="field">Nazwa modelu *<input name="name" required value="${esc(m.name||'')}" placeholder="np. Radiowóz miejski"></label><label class="field">Kategoria<input name="category" value="${esc(m.category||'')}" placeholder="np. Pojazdy"></label><label class="field">Developer<select name="developer"><option value="">Nie przypisano</option>${db.developers.map(d=>`<option value="${d.id}" ${m.developer===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select></label><label class="field">Status<select name="status">${['Do weryfikacji','Zweryfikowany','Podejrzany','Odrzucony'].map(s=>`<option ${m.status===s?'selected':''}>${s}</option>`).join('')}</select></label></div><label class="field">Link do źródła / dowodu<input name="source" type="url" value="${esc(m.source||'')}" placeholder="https://..."></label><label class="field">Notatki i informacje o pochodzeniu<textarea name="notes" placeholder="Skąd pochodzi model? Jakie dowody autorstwa otrzymano?">${esc(m.notes||'')}</textarea></label><div class="grid"><label class="field">Zdjęcie modelu<input name="image" type="file" accept="image/*"><small>${m.image?'Nowe zdjęcie zastąpi obecne.':'Opcjonalnie, najlepiej niewielki plik.'}</small></label><label class="field">Akta / załączniki<input name="files" type="file" multiple><small>${m.files?.length?`Obecnie ${m.files.length} plik(i). Nowe zostaną dodane.`:'Możesz dodać kilka plików.'} Łącznie zalecane do 2 MB.</small></label></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Anuluj</button><button class="btn primary">Zapisz model</button></div></form>`);$('#modelForm').onsubmit=async e=>{e.preventDefault();let f=e.target, image=f.elements.namedItem('image').files[0],files=[...f.elements.namedItem('files').files];if((image?.size||0)+files.reduce((a,x)=>a+x.size,0)>2*1024*1024){alert('Nowe pliki przekraczają łącznie 2 MB. Wybierz mniejsze pliki.');return}let item={...m,id:m.id||uid(),created:m.created||new Date().toISOString(),name:f.elements.namedItem('name').value.trim(),category:f.elements.namedItem('category').value.trim(),developer:f.elements.namedItem('developer').value,status:f.elements.namedItem('status').value,source:f.elements.namedItem('source').value.trim(),notes:f.elements.namedItem('notes').value.trim(),image:image?await fileData(image):m.image,files:[...(m.files||[]),...await Promise.all(files.map(fileData))]};if(!item.name)return;let old=[...db.models];db.models=id?db.models.map(x=>x.id===id?item:x):[...db.models,item];if(!await save()){db.models=old;return}closeModal();render()}}
function fileData(f){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve({name:f.name,data:r.result});r.onerror=reject;r.readAsDataURL(f)})}
function developerForm(id){let d=db.developers.find(x=>x.id===id)||{};openModal(`<div class="modal-head"><h2>${id?'Edytuj developera':'Dodaj developera'}</h2><button class="close" onclick="closeModal()">×</button></div><form id="devForm"><div class="grid"><label class="field">Nazwa / imię *<input name="name" required value="${esc(d.name||'')}" placeholder="Nazwa developera"></label><label class="field">Nazwa na Roblox<input name="roblox" value="${esc(d.roblox||'')}" placeholder="@username"></label><label class="field">Rola<input name="role" value="${esc(d.role||'')}" placeholder="np. Modelarz 3D"></label><label class="field">Kontakt<input name="contact" value="${esc(d.contact||'')}" placeholder="np. Discord"></label></div><label class="field">Notatki<textarea name="notes" placeholder="Ustalenia, współpraca, informacje o autorstwie...">${esc(d.notes||'')}</textarea></label><label class="field">Akta / załączniki<input name="files" type="file" multiple><small>${d.files?.length?`Obecnie ${d.files.length} plik(i). Nowe zostaną dodane.`:'Opcjonalne dokumenty.'} Łącznie zalecane do 2 MB.</small></label><div class="actions"><button type="button" class="btn" onclick="closeModal()">Anuluj</button><button class="btn primary">Zapisz developera</button></div></form>`);$('#devForm').onsubmit=async e=>{e.preventDefault();let f=e.target,files=[...f.elements.namedItem('files').files];if(files.reduce((a,x)=>a+x.size,0)>2*1024*1024){alert('Nowe pliki przekraczają łącznie 2 MB.');return}let item={...d,id:d.id||uid(),created:d.created||new Date().toISOString(),name:f.elements.namedItem('name').value.trim(),roblox:f.elements.namedItem('roblox').value.trim(),role:f.elements.namedItem('role').value.trim(),contact:f.elements.namedItem('contact').value.trim(),notes:f.elements.namedItem('notes').value.trim(),files:[...(d.files||[]),...await Promise.all(files.map(fileData))]};if(!item.name)return;let old=[...db.developers];db.developers=id?db.developers.map(x=>x.id===id?item:x):[...db.developers,item];if(!await save()){db.developers=old;return}closeModal();render()}}
function filesHtml(files,type,id){return files?.length?`<div class="detail-row files"><b>Załączniki</b>${files.map((f,i)=>`<div><a href="${esc(f.data)}" download="${esc(f.name)}">↓ ${esc(f.name)}</a> <button class="textbtn" onclick="removeFile('${type}','${id}',${i})">Usuń</button></div>`).join('')}</div>`:''}async function removeFile(type,id,i){if(!confirm('Usunąć ten załącznik?'))return;let list=type==='model'?db.models:db.developers;let x=list.find(x=>x.id===id);let old=[...x.files];x.files.splice(i,1);if(!await save()){x.files=old;return}type==='model'?modelDetail(id):developerDetail(id)}
function modelDetail(id){let m=db.models.find(x=>x.id===id);if(!m)return;openModal(`<div class="modal-head"><h2>${esc(m.name)}</h2><button class="close" onclick="closeModal()">×</button></div>${m.image?`<img src="${esc(m.image.data)}" style="width:100%;max-height:240px;object-fit:contain;background:#11141a;border-radius:8px"><button class="textbtn" onclick="removeImage('${id}')">Usuń zdjęcie</button>`:''}<div class="detail-row"><b>Status</b>${status(m.status)}</div><div class="detail-row"><b>Developer</b>${esc(devName(m.developer))}</div><div class="detail-row"><b>Kategoria</b>${esc(m.category||'—')}</div><div class="detail-row"><b>Źródło / dowód</b>${m.source?`<a href="${esc(m.source)}" target="_blank" rel="noopener noreferrer">${esc(m.source)}</a>`:'—'}</div><div class="detail-row"><b>Notatki</b><span style="white-space:pre-wrap">${esc(m.notes||'—')}</span></div>${filesHtml(m.files,'model',id)}<div class="actions"><button class="btn danger" onclick="deleteItem('model','${id}')">Usuń</button><button class="btn primary" onclick="modelForm('${id}')">Edytuj model</button></div>`)}async function removeImage(id){let m=db.models.find(x=>x.id===id),old=m.image;delete m.image;if(!await save()){m.image=old;return}modelDetail(id);render()}
function developerDetail(id){let d=db.developers.find(x=>x.id===id);if(!d)return;let ms=db.models.filter(m=>m.developer===id);openModal(`<div class="modal-head"><h2>${esc(d.name)}</h2><button class="close" onclick="closeModal()">×</button></div><div class="detail-row"><b>Roblox</b>${esc(d.roblox||'—')}</div><div class="detail-row"><b>Rola</b>${esc(d.role||'—')}</div><div class="detail-row"><b>Kontakt</b>${esc(d.contact||'—')}</div><div class="detail-row"><b>Notatki</b><span style="white-space:pre-wrap">${esc(d.notes||'—')}</span></div>${filesHtml(d.files,'developer',id)}<div class="detail-row"><b>Przypisane modele (${ms.length})</b>${ms.length?ms.map(m=>`<button class="textbtn" onclick="modelDetail('${m.id}')">${esc(m.name)} →</button>`).join('<br>'):'Brak przypisanych modeli.'}</div><div class="actions"><button class="btn danger" onclick="deleteItem('developer','${id}')">Usuń</button><button class="btn primary" onclick="developerForm('${id}')">Edytuj akta</button></div>`)}async function deleteItem(type,id){if(!confirm(type==='model'?'Usunąć model i jego załączniki?':'Usunąć developera? Jego modele pozostaną, ale nie będą przypisane.'))return;let old=JSON.stringify(db);if(type==='model')db.models=db.models.filter(x=>x.id!==id);else{db.developers=db.developers.filter(x=>x.id!==id);db.models.forEach(m=>{if(m.developer===id)m.developer=''})}if(!await save()){db=JSON.parse(old);return}closeModal();render()}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='asset-vault-kopia.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}$('#importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!Array.isArray(data.models)||!Array.isArray(data.developers)||!data.models.every(x=>x&&typeof x.id==='string'&&typeof x.name==='string')||!data.developers.every(x=>x&&typeof x.id==='string'&&typeof x.name==='string'))throw Error();if(!confirm('Import zastąpi wszystkie obecne dane. Kontynuować?'))return;let old=db;db=data;if(!await save()){db=old;return}render();alert('Kopia została przywrócona.')}catch(err){alert('Nieprawidłowy plik kopii Asset Vault.')}finally{e.target.value=''}};
async function logout(){await client.auth.signOut();location.reload()}
async function startApp(){
 if(!window.supabase || !window.VAULT_CONFIG || !VAULT_CONFIG.url || !VAULT_CONFIG.anonKey){document.body.innerHTML='<div style="padding:40px;color:white">Brak konfiguracji. Uzupełnij config.js zgodnie z instrukcją README.</div>';return}
 client=window.supabase.createClient(VAULT_CONFIG.url,VAULT_CONFIG.anonKey);
 const {data:{session}}=await client.auth.getSession();
 if(!session){showLogin();return} await loadVault();
}
function showLogin(msg=''){
 document.body.insertAdjacentHTML('beforeend',`<div id="loginOverlay" style="position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#0c0e13;padding:20px"><div class="modal" style="max-width:420px"><div class="eyebrow">ASSET VAULT · PRYWATNY DOSTĘP</div><h2 style="margin:12px 0">Zaloguj się</h2><p style="color:#9299a6;line-height:1.6;margin-bottom:24px">Użyj konta przyznanego przez administratora kartoteki.</p><form id="loginForm"><label class="field">Adres e-mail<input type="email" name="email" required autocomplete="username"></label><label class="field">Hasło<input type="password" name="password" required autocomplete="current-password"></label><p id="loginError" style="color:#ef9b9b">${esc(msg)}</p><button class="btn primary" style="width:100%">Zaloguj się →</button></form></div></div>`);
 document.querySelector('#loginForm').onsubmit=async e=>{e.preventDefault();let f=e.target;let {error}=await client.auth.signInWithPassword({email:f.elements.namedItem('email').value,password:f.elements.namedItem('password').value});if(error){document.querySelector('#loginError').textContent='Nie udało się zalogować. Sprawdź dane logowania.';return}document.querySelector('#loginOverlay').remove();await loadVault()}
}
async function loadVault(){let {data,error}=await client.from('vault').select('data,revision').eq('id',1).maybeSingle();if(error||!data){await client.auth.signOut();showLogin('To konto nie ma dostępu do kartoteki. Skontaktuj się z administratorem.');return}db=data.data;revision=data.revision;if(!db||!Array.isArray(db.models)||!Array.isArray(db.developers)){alert('Błędne dane w bazie.');return}render()}
startApp();</script></body></html>
