<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Studio Hub</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{--bg:#0b0e14;--panel:#151923;--border:#292e3b;--text:#f2f3f6;--muted:#8e96a6;--accent:#c6f36b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px 'DM Sans',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}aside{width:230px;position:fixed;inset:0 auto 0 0;background:#10131a;border-right:1px solid #252a34;padding:27px 16px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;font:700 17px 'Space Grotesk';letter-spacing:.02em;padding:0 8px 34px}.brand b{background:var(--accent);border-radius:9px;color:#17200c;width:36px;height:36px;display:grid;place-items:center;font-size:20px}.brand small{display:block;color:#727c89;font:10px 'DM Sans';letter-spacing:.13em;margin-top:4px}.navlabel,.eyebrow{font-size:10px;letter-spacing:.15em;font-weight:700;color:#7f897e}.navlabel{margin:10px 10px}.nav{display:grid;gap:4px}.nav button{border:0;border-radius:8px;background:transparent;color:#969eac;text-align:left;padding:12px;display:flex;gap:13px}.nav button span{width:20px;text-align:center;font-size:16px}.nav button.active{color:#d9f6aa;background:#262f25}.foot{margin-top:auto;border-top:1px solid #2a303a;padding:18px 10px 0;color:#9299a7;font-size:12px;line-height:1.7}.foot b{color:#c9dcb5}.dot{display:inline-block;border-radius:50%;background:var(--accent);width:7px;height:7px;margin-right:6px}.main{margin-left:230px}.topbar{height:70px;border-bottom:1px solid #242934;padding:0 38px;display:flex;align-items:center;justify-content:space-between;color:#858e9d;font-size:12px}.account{display:flex;align-items:center;gap:15px}.avatar{background:#303c2a;color:#d9f7a7;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;font-weight:700}.container{max-width:1500px;margin:auto;padding:37px 38px 70px}.heading{display:flex;justify-content:space-between;align-items:flex-end;gap:15px}.eyebrow{color:var(--accent)}h1{font:600 32px 'Space Grotesk';letter-spacing:-.04em;margin:9px 0 7px}h2{font:600 19px 'Space Grotesk';margin:0 0 6px}p{color:var(--muted);line-height:1.55;margin:0}.btn{background:#1a1f29;border:1px solid #353c48;color:#e8eced;border-radius:8px;padding:10px 14px;font-weight:600}.btn:hover{border-color:#a6c67f}.primary{background:var(--accent);border-color:var(--accent);color:#141a0e}.small{font-size:12px;padding:8px 11px}.textbtn{background:none;border:0;color:var(--accent);font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:28px 0}.stat,.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px}.stat{padding:18px}.stat-label{display:flex;justify-content:space-between;color:#a6aeb9;font-size:12px}.stat-label span{color:#b7d995;font-size:16px}.stat strong{font:600 27px 'Space Grotesk';display:block;margin:12px 0 4px}.stat small{color:#737d8a}.section{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:32px 0 16px}.section p{font-size:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{overflow:hidden}.panel-title{display:flex;justify-content:space-between;padding:18px;border-bottom:1px solid var(--border);font:600 15px 'Space Grotesk'}.minirow,.listrow{display:flex;align-items:center;gap:12px;padding:14px 17px;border-bottom:1px solid #282e38;cursor:pointer}.minirow:last-child,.listrow:last-child{border-bottom:0}.minirow:hover,.listrow:hover,.task:hover{background:#1b202a}.minirow .info,.listrow .info{flex:1;min-width:0}.info b{display:block;font-size:13px}.info small,.task small{display:block;color:#838d9c;margin-top:5px;font-size:11px}.bubble{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;background:#2b3528;color:#cceaa5;flex-shrink:0}.badge{font-size:10px;border-radius:5px;padding:5px 7px;background:#303338;color:#c6ccd4;white-space:nowrap}.badge.green{background:#263c2e;color:#a3dbad}.badge.orange{background:#3a3327;color:#e8cb87}.badge.red{background:#402b30;color:#eca3aa}.empty{color:#828c9b;text-align:center;padding:35px 16px;font-size:12px;line-height:1.6}.toolbar{display:flex;gap:10px;margin:22px 0 16px}.toolbar input{flex:1}.toolbar select{width:170px}input,select,textarea{width:100%;background:#171c25;color:#eff1f3;border:1px solid #333a46;border-radius:8px;padding:10px 12px;outline:none}input:focus,select:focus,textarea:focus{border-color:#abc97b}.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.column{background:#12161e;border:1px solid #292f38;border-radius:10px;min-height:180px;padding:13px}.colhead{font-weight:700;color:#b9c2ca;font-size:12px;display:flex;justify-content:space-between;padding:4px 3px 13px}.colhead i{font-style:normal;color:#7f8996}.task{border:1px solid #303743;background:#1b2029;border-radius:9px;padding:14px;margin-bottom:9px;cursor:pointer}.task b{display:block;margin:8px 0;overflow-wrap:anywhere}.taskfooter{display:flex;justify-content:space-between;align-items:end;gap:8px}.task select{width:auto;max-width:120px;padding:6px;font-size:10px}.notice{border:1px solid #39482c;background:#222b20;border-radius:8px;padding:13px;color:#b7cda8;font-size:12px;line-height:1.5;margin-top:22px}.modalbg{position:fixed;inset:0;background:#07090edb;display:grid;place-items:center;z-index:5;padding:18px}.modal{width:min(650px,100%);max-height:92vh;overflow:auto;background:#191e27;border:1px solid #363e4b;border-radius:14px;padding:25px;box-shadow:0 20px 70px #0009}.modal.narrow{width:min(430px,100%)}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modalhead h2{font-size:21px}.close{border:0;background:none;color:#9ca5b2;font-size:25px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.field{display:block;color:#b3bdc8;font-size:12px;font-weight:600;margin-bottom:14px}.field input,.field select,.field textarea{margin-top:7px}.field textarea{min-height:90px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap;margin-top:20px}.danger{color:#f3a0a3;margin-right:auto}.line{padding:12px 0;border-bottom:1px solid #343a45;white-space:pre-wrap;overflow-wrap:anywhere}.line small{display:block;color:#8993a1;font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}.error{color:#f0a0a4;white-space:pre-wrap}.calendar-head{display:flex;justify-content:space-between;align-items:center;margin:20px 0}.calendar{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--border);border-left:1px solid var(--border)}.dayname{color:#8b95a2;font-size:11px;text-align:center;padding:10px;border-right:1px solid var(--border)}.day{min-height:105px;padding:8px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);background:#141820;color:#aab2bf}.day.other{opacity:.4}.day.today>strong{background:var(--accent);color:#12180c;border-radius:50%;display:inline-grid;place-items:center;width:24px;height:24px}.calitem{background:#2c3a2b;border-radius:4px;color:#d2edba;font-size:10px;padding:5px;margin-top:5px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.calitem.bug{background:#432f32;color:#f5b6b6}.calitem.taskc{background:#293545;color:#bdd7f6}.hidden{display:none!important}@media(max-width:850px){aside{width:65px;padding:22px 7px}.brand{padding:0 7px 27px}.brand div,.navlabel,.nav button em,.foot{display:none}.nav button{justify-content:center}.main{margin-left:65px}.topbar{padding:0 20px}.container{padding:25px 20px}.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.kanban{grid-template-columns:1fr}.calendar{min-width:600px}.calwrap{overflow:auto}.account span{display:none}}@media(max-width:500px){.heading{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}.toolbar select{width:100%}}
</style></head><body><aside><div class="brand"><b>✳</b><div>STUDIO HUB<small>TEAM WORKSPACE</small></div></div><div class="navlabel">PRZESTRZEŃ ZESPOŁU</div><nav class="nav"><button data-view="home" class="active"><span>▦</span><em>Przegląd</em></button><button data-view="task"><span>◫</span><em>Zadania</em></button><button data-view="bug"><span>◎</span><em>Zgłoszenia błędów</em></button><button data-view="release"><span>≡</span><em>Dziennik zmian</em></button><button data-view="event"><span>▤</span><em>Kalendarz</em></button></nav><div class="foot"><b><span class="dot"></span>Przestrzeń zespołu</b><br><span id="rolelabel"></span></div></aside><div class="main"><header class="topbar"><div>STUDIO HUB &nbsp; / &nbsp; <b id="crumb" style="color:#d5dae0">Przegląd</b></div><div class="account"><span id="account"></span><button class="textbtn" id="authButton" onclick="authAction()">Zaloguj jako admin</button><div class="avatar">SH</div></div></header><main class="container" id="content"></main></div><div id="modal"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script>
let client,user,role='',items=[],view='home',query='',statusFilter='',month=new Date();month.setDate(1);const $=s=>document.querySelector(s);const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const labels={home:'Przegląd',task:'Zadania',bug:'Zgłoszenia błędów',release:'Dziennik zmian',event:'Kalendarz'};const icons={task:'◫',bug:'◎',release:'≡',event:'▤'};const statusOptions={task:['Do zrobienia','W trakcie','Gotowe'],bug:['Nowy','W trakcie','Naprawiony'],release:['Opublikowany','Szkic'],event:['Planowane','Zakończone']};const priorities=['Niski','Normalny','Wysoki','Krytyczny'];const canEdit=()=>role==='admin';
function show(html,cls=''){ $('#modal').innerHTML=`<div class="modalbg"><div class="modal ${cls}">${html}</div></div>`}function closeModal(){$('#modal').innerHTML=''}
async function start(){if(!window.supabase||!window.HUB_CONFIG||!HUB_CONFIG.url||!HUB_CONFIG.anonKey||HUB_CONFIG.anonKey==='TWOJ_KLUCZ_ANON'){show('<h2>Skonfiguruj Studio Hub</h2><p>Uzupełnij plik config.js według instrukcji README.md, aby połączyć aplikację z Supabase.</p>','narrow');return}try{client=supabase.createClient(HUB_CONFIG.url,HUB_CONFIG.anonKey);let {data,error}=await client.auth.getSession();if(error)throw error;data.session?await enter(data.session.user):await publicMode()}catch(e){show(`<h2>Błąd połączenia</h2><p>${E(e.message)}</p>`,'narrow')}}
function login(message=''){show(`<div class="modalhead"><h2>Logowanie administratora</h2><button class="close" onclick="closeModal()">×</button></div><p>Developerzy mogą przeglądać panel bez logowania.</p><br><form id="loginForm"><label class="field">Adres e-mail<input name="email" type="email" required autocomplete="username"></label><label class="field">Hasło<input name="password" type="password" required autocomplete="current-password"></label><p class="error" id="loginError">${E(message)}</p><button class="btn primary" style="width:100%;margin-top:12px">Zaloguj się →</button></form>`,'narrow');$('#loginForm').onsubmit=async e=>{e.preventDefault();let f=e.target;let {data,error}=await client.auth.signInWithPassword({email:f.elements.namedItem('email').value,password:f.elements.namedItem('password').value});if(error){$('#loginError').textContent='Nie udało się zalogować. Sprawdź dane i połączenie.';return}await enter(data.user)}}
async function publicMode(){user=null;role='developer';$('#account').textContent='Developer · dostęp publiczny';$('#rolelabel').textContent='Developer · tylko odczyt';$('#authButton').textContent='Zaloguj jako admin';closeModal();await load()}
async function enter(u){let {data,error}=await client.from('hub_members').select('role').eq('user_id',u.id).maybeSingle();if(error||!data||data.role!=='admin'){await publicMode();return}user=u;role='admin';$('#account').textContent=u.email;$('#rolelabel').textContent='Administrator';$('#authButton').textContent='Wyloguj';closeModal();await load()}
function authAction(){if(role==='admin')logout();else login()}
async function logout(){await client.auth.signOut();await publicMode()}
async function load(){try{let all=[],offset=0;while(true){let {data,error}=await client.from('hub_items').select('*').order('id').range(offset,offset+499);if(error)throw error;all.push(...data);if(data.length<500)break;offset+=data.length}items=all.sort((a,b)=>b.created_at.localeCompare(a.created_at));render()}catch(e){alert('Nie udało się pobrać danych: '+e.message)}}
function goto(v){view=v;query='';statusFilter='';render()}document.querySelector('.nav').onclick=e=>{let b=e.target.closest('button');if(b)goto(b.dataset.view)};
function fmt(s,withTime=false){if(!s)return 'Bez terminu';let d=new Date(s);return isNaN(d)?'Nieprawidłowa data':d.toLocaleDateString('pl-PL',withTime?{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}:{day:'numeric',month:'short',year:'numeric'})}function badge(x){let s=x.status||'—',cls=['Gotowe','Naprawiony','Opublikowany','Zakończone'].includes(s)?'green':['W trakcie','Szkic','Planowane'].includes(s)?'orange':'';return `<span class="badge ${cls}">${E(s)}</span>`}function priority(p){return `<span class="badge ${p==='Krytyczny'?'red':p==='Wysoki'?'orange':''}">${E(p||'Normalny')}</span>`}function titleBlock(eyebrow,title,desc,kind){return `<div class="heading"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div>${canEdit()&&kind?`<button class="btn primary" onclick="form('${kind}')">＋ &nbsp; ${kind==='task'?'Dodaj zadanie':kind==='bug'?'Zgłoś błąd':kind==='release'?'Dodaj wpis':'Dodaj wydarzenie'}</button>`:''}</div>`}
function mini(x){return `<div class="minirow" onclick="detail('${x.id}')"><div class="bubble">${icons[x.kind]}</div><div class="info"><b>${E(x.title)}</b><small>${E(x.assignee||labels[x.kind])} · ${fmt(x.due_at||x.created_at)}</small></div>${badge(x)}</div>`}function none(t){return `<div class="empty">${t}</div>`}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('#crumb').textContent=labels[view];let c=$('#content');if(view==='home'){let tasks=items.filter(x=>x.kind==='task'&&x.status!=='Gotowe'),bugs=items.filter(x=>x.kind==='bug'&&x.status!=='Naprawiony'),events=items.filter(x=>x.due_at&&new Date(x.due_at)>=new Date()&&['event','task','bug'].includes(x.kind)).sort((a,b)=>a.due_at.localeCompare(b.due_at));let releases=items.filter(x=>x.kind==='release');c.innerHTML=titleBlock('TWOJA PRZESTRZEŃ ROBOCZA','Dobra robota zaczyna się tutaj.','Wszystko, czego potrzebuje Twój zespół, w jednym miejscu.','task')+`<div class="stats"><div class="stat"><div class="stat-label">Otwarte zadania <span>◫</span></div><strong>${tasks.length}</strong><small>Do zrobienia lub w trakcie</small></div><div class="stat"><div class="stat-label">Otwarte błędy <span>◎</span></div><strong>${bugs.length}</strong><small>Wymagają uwagi</small></div><div class="stat"><div class="stat-label">Wpisy zmian <span>≡</span></div><strong>${releases.length}</strong><small>W całym dzienniku</small></div><div class="stat"><div class="stat-label">Nadchodzące terminy <span>▤</span></div><strong>${events.length}</strong><small>Od teraz w kalendarzu</small></div></div><div class="section"><div><h2>Na bieżąco</h2><p>Szybki przegląd pracy i najbliższych terminów.</p></div><button class="textbtn" onclick="load()">↻ Odśwież dane</button></div><div class="two"><div class="panel"><div class="panel-title">Otwarte zadania <button class="textbtn" onclick="goto('task')">Zobacz wszystkie →</button></div>${tasks.slice(0,5).map(mini).join('')||none('Jeszcze nie ma otwartych zadań.')}</div><div class="panel"><div class="panel-title">Najbliższe terminy <button class="textbtn" onclick="goto('event')">Otwórz kalendarz →</button></div>${events.slice(0,5).map(mini).join('')||none('Brak nadchodzących terminów.')}</div><div class="panel"><div class="panel-title">Zgłoszenia błędów <button class="textbtn" onclick="goto('bug')">Wszystkie błędy →</button></div>${bugs.slice(0,5).map(mini).join('')||none('Brak otwartych zgłoszeń.')}</div><div class="panel"><div class="panel-title">Ostatnie zmiany <button class="textbtn" onclick="goto('release')">Dziennik zmian →</button></div>${releases.slice(0,5).map(mini).join('')||none('Nie dodano jeszcze wpisów.')}</div></div>`;return}if(view==='event'){renderCalendar();return}let subtitles={task:'Planuj pracę, przypisuj osoby i przesuwaj zadania między etapami.',bug:'Zbieraj zgłoszenia i śledź postęp napraw.',release:'Dokumentuj zmiany w kolejnych wersjach swojej gry.'};c.innerHTML=titleBlock(view==='task'?'ORGANIZACJA PRACY':view==='bug'?'KONTROLA JAKOŚCI':'HISTORIA PRODUKTU',labels[view],subtitles[view],view)+`<div class="toolbar"><input id="search" placeholder="⌕  Szukaj po nazwie, opisie lub osobie..." value="${E(query)}"><select id="filter"><option value="">Wszystkie statusy</option>${statusOptions[view].map(s=>`<option ${statusFilter===s?'selected':''}>${s}</option>`).join('')}</select><button class="btn" onclick="load()">↻</button></div><div id="list"></div>`;$('#search').oninput=e=>{query=e.target.value;drawList()};$('#filter').onchange=e=>{statusFilter=e.target.value;drawList()};drawList()}
function filtered(){let q=query.toLowerCase();return items.filter(x=>x.kind===view&&(!statusFilter||x.status===statusFilter)&&[x.title,x.description,x.assignee,x.version].some(v=>String(v||'').toLowerCase().includes(q)))}
function drawList(){let a=filtered();if(view==='task'){$('#list').innerHTML=`<div class="kanban">${statusOptions.task.map(s=>{let col=a.filter(x=>x.status===s);return `<div class="column"><div class="colhead">${E(s)} <i>${col.length}</i></div>${col.map(x=>`<div class="task" onclick="detail('${x.id}')">${priority(x.priority)}<b>${E(x.title)}</b><small>${E(x.assignee||'Nie przypisano')} · ${fmt(x.due_at)}</small><div class="taskfooter"><small>Otwórz szczegóły →</small>${canEdit()?`<select onclick="event.stopPropagation()" onchange="moveTask('${x.id}',this.value)">${statusOptions.task.map(z=>`<option ${x.status===z?'selected':''}>${z}</option>`).join('')}</select>`:''}</div></div>`).join('')||none('Brak zadań')}</div>`}).join('')}</div>`;return}$('#list').innerHTML=`<div class="panel">${a.map(x=>`<div class="listrow" onclick="detail('${x.id}')"><div class="bubble">${icons[x.kind]}</div><div class="info"><b>${E(x.title)}</b><small>${E(x.kind==='release'?(x.version||'Bez wersji'):(x.assignee||'Nie przypisano'))} · ${fmt(x.due_at||x.created_at)}</small></div>${x.kind==='bug'?priority(x.priority):''}${badge(x)} <span style="color:#838d98">→</span></div>`).join('')||none('Brak wpisów. Dodaj pierwszy lub zmień filtr.')}</div>`}
function localDate(d){let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}function renderCalendar(){let c=$('#content');let start=new Date(month.getFullYear(),month.getMonth(),1),offset=(start.getDay()+6)%7;start.setDate(start.getDate()-offset);let now=localDate(new Date());let html='';for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let key=localDate(d),list=items.filter(x=>x.due_at&&localDate(new Date(x.due_at))===key&&['task','bug','event'].includes(x.kind));html+=`<div class="day ${d.getMonth()!==month.getMonth()?'other':''} ${key===now?'today':''}"><strong>${d.getDate()}</strong>${list.map(x=>`<div class="calitem ${x.kind==='bug'?'bug':x.kind==='task'?'taskc':''}" title="${E(x.title)}" onclick="detail('${x.id}')">${E(x.title)}</div>`).join('')}</div>`}c.innerHTML=titleBlock('HARMONOGRAM ZESPOŁU','Kalendarz','Wydarzenia oraz terminy zadań i zgłoszeń w jednym widoku.','event')+`<div class="calendar-head"><h2 style="text-transform:capitalize">${E(month.toLocaleDateString('pl-PL',{month:'long',year:'numeric'}))}</h2><div><button class="btn small" onclick="shiftMonth(-1)">←</button> <button class="btn small" onclick="todayMonth()">Dzisiaj</button> <button class="btn small" onclick="shiftMonth(1)">→</button></div></div><div class="calwrap"><div class="calendar">${['Pon','Wt','Śr','Czw','Pt','Sob','Niedz'].map(x=>`<div class="dayname">${x}</div>`).join('')}${html}</div></div><div class="notice">W kalendarzu widać wydarzenia oraz zadania i błędy z ustawionym terminem. Daty i godziny wyświetlane są w lokalnej strefie czasowej przeglądarki.</div>`}function shiftMonth(n){month.setMonth(month.getMonth()+n);renderCalendar()}function todayMonth(){month=new Date();month.setDate(1);renderCalendar()}
function detail(id){let x=items.find(z=>z.id===id);if(!x)return;let line=(name,v)=>`<div class="line"><small>${E(name)}</small>${E(v||'—')}</div>`;let link='';try{let u=new URL(x.image_url);if(['http:','https:'].includes(u.protocol))link=`<div class="line"><small>Link do zrzutu ekranu</small><a style="color:#c6f36b" href="${E(u.href)}" target="_blank" rel="noopener noreferrer">${E(u.href)}</a></div>`}catch(e){}show(`<div class="modalhead"><h2>${E(x.title)}</h2><button class="close" onclick="closeModal()">×</button></div>${line('Rodzaj',labels[x.kind])}${line('Status',x.status)}${['task','bug'].includes(x.kind)?line('Priorytet',x.priority)+line('Osoba odpowiedzialna',x.assignee):''}${x.kind==='release'?line('Wersja',x.version):''}${line(x.kind==='event'?'Data wydarzenia':'Termin',x.due_at?fmt(x.due_at,true):'—')}${line('Opis',x.description)}${link}<div class="actions">${role==='admin'?`<button class="btn danger" onclick="removeItem('${x.id}')">Usuń</button>`:''}${canEdit()?`<button class="btn primary" onclick="form('${x.kind}','${x.id}')">Edytuj</button>`:''}</div>`)}
function form(kind,id){if(!canEdit())return;let x=items.find(i=>i.id===id)||{kind,status:statusOptions[kind][0],priority:'Normalny'},dt=x.due_at?new Date(x.due_at):null;let local=dt&&!isNaN(dt)?localDate(dt)+'T'+String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0'):'';show(`<div class="modalhead"><h2>${id?'Edytuj':kind==='bug'?'Zgłoś':'Dodaj'} ${kind==='task'?'zadanie':kind==='bug'?'błąd':kind==='release'?'wpis zmiany':'wydarzenie'}</h2><button class="close" onclick="closeModal()">×</button></div><form id="entryForm"><label class="field">Tytuł *<input name="title" required maxlength="200" value="${E(x.title||'')}" placeholder="Krótka i czytelna nazwa"></label><label class="field">Opis<textarea name="description" placeholder="Dodaj szczegóły...">${E(x.description||'')}</textarea></label><div class="grid"><label class="field">Status<select name="status">${statusOptions[kind].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></label>${['task','bug'].includes(kind)?`<label class="field">Priorytet<select name="priority">${priorities.map(p=>`<option ${x.priority===p?'selected':''}>${p}</option>`).join('')}</select></label><label class="field">Osoba odpowiedzialna<input name="assignee" value="${E(x.assignee||'')}" placeholder="Nazwa lub nick"></label>`:''}${kind==='release'?`<label class="field">Wersja<input name="version" value="${E(x.version||'')}" placeholder="np. v1.4"></label>`:''}<label class="field">${kind==='event'?'Data i godzina wydarzenia *':'Termin (opcjonalnie)'}<input type="datetime-local" name="due_at" ${kind==='event'?'required':''} value="${E(local)}"></label></div>${kind==='bug'?`<label class="field">Link do zrzutu ekranu (opcjonalnie)<input name="image_url" type="url" value="${E(x.image_url||'')}" placeholder="https://..."><small style="color:#858e9d;display:block;margin-top:5px">Aplikacja przechowuje link, nie przesyła zdjęcia. Zadbaj o dostęp do pliku.</small></label>`:''}<p class="error" id="formError"></p><div class="actions"><button class="btn" type="button" onclick="closeModal()">Anuluj</button><button class="btn primary">Zapisz</button></div></form>`);$('#entryForm').onsubmit=async e=>{e.preventDefault();let f=e.target,v=n=>f.elements.namedItem(n)?.value.trim()||'',title=v('title');if(!title){$('#formError').textContent='Podaj tytuł.';return}let due=v('due_at');if(due&&isNaN(new Date(due))){$('#formError').textContent='Nieprawidłowa data.';return}let img=v('image_url');if(img){try{if(!['http:','https:'].includes(new URL(img).protocol))throw 0}catch(z){$('#formError').textContent='Link musi zaczynać się od http:// lub https://';return}}let data={kind,title,description:v('description'),status:v('status'),priority:v('priority'),assignee:v('assignee'),version:v('version'),image_url:img,due_at:due?new Date(due).toISOString():null,updated_at:new Date().toISOString()};let result;if(id){result=await client.from('hub_items').update(data).eq('id',id).eq('updated_at',x.updated_at).select('id')}else{data.created_by=user.id;result=await client.from('hub_items').insert(data).select('id')}if(result.error){$('#formError').textContent='Nie udało się zapisać: '+result.error.message;return}if(!result.data?.length){$('#formError').textContent='Wpis został zmieniony przez inną osobę. Skopiuj swoje zmiany, zamknij okno i odśwież stronę.';return}closeModal();await load()}}
async function moveTask(id,value){let x=items.find(z=>z.id===id);if(!x||!canEdit())return;let {data,error}=await client.from('hub_items').update({status:value,updated_at:new Date().toISOString()}).eq('id',id).eq('updated_at',x.updated_at).select('id');if(error||!data?.length)alert(error?'Nie udało się zapisać: '+error.message:'Wpis zmienił się w międzyczasie. Odświeżono dane.');await load()}
async function removeItem(id){if(role!=='admin'||!confirm('Usunąć ten wpis na stałe?'))return;let {data,error}=await client.from('hub_items').delete().eq('id',id).select('id');if(error||!data?.length){alert('Nie udało się usunąć wpisu: '+(error?.message||'Brak uprawnień'));return}closeModal();await load()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});start();
</script></body></html>
